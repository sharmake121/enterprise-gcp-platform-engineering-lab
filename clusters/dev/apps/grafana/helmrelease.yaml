apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: grafana
      version: "10.3.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  values:
    serviceAccount:
      create: true
      name: grafana
      automountServiceAccountToken: true
      annotations:
        iam.gke.io/gcp-service-account: grafana-monitoring@verdant-tempest-504711-j0.iam.gserviceaccount.com
