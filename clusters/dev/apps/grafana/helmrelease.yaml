apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: grafana
      version: "10.3.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  values:
    serviceAccount:
      create: true
      name: grafana
      automountServiceAccountToken: true
      annotations:
        iam.gke.io/gcp-service-account: grafana-monitoring@client-data-plane-project.iam.gserviceaccount.com

    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Google Cloud Monitoring
            type: stackdriver
            access: proxy
            isDefault: true
            jsonData:
              authenticationType: gce
              defaultProject: client-data-plane-project