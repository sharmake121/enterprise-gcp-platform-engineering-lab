apiVersion: v1
kind: ConfigMap
metadata:
  name: gke-overview-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  gke-overview.json: |
    {
      "title": "GKE Cluster Overview",
      "uid": "gke-overview",
      "schemaVersion": 42,
      "version": 2,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "GKE Node CPU",
          "type": "timeseries",
          "datasource": {
            "type": "stackdriver",
            "uid": "P53B7819E0F26D6F4"
          },
          "targets": [
            {
              "datasource": {
                "type": "stackdriver",
                "uid": "P53B7819E0F26D6F4"
              },
              "queryType": "timeSeriesList",
              "refId": "A",
              "timeSeriesList": {
                "alignmentPeriod": "60s",
                "crossSeriesReducer": "REDUCE_MEAN",
                "filters": [
                  "resource.type",
                  "=",
                  "k8s_node",
                  "AND",
                  "metric.type",
                  "=",
                  "kubernetes.io/node/cpu/allocatable_utilization"
                ],
                "groupBys": [],
                "perSeriesAligner": "ALIGN_MEAN",
                "projectName": "client-data-plane-project",
                "view": "FULL"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
