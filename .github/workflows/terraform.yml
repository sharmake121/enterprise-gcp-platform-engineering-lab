name: Terraform CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      TF_VAR_project_id: "verdant-tempest-504711-j0"
      TF_VAR_region: "us-central1"
      TF_VAR_admin_group: "sharmake7210@gmail.com"
      TF_VAR_vpc_name: "enterprise-vpc"
      TF_VAR_subnet_name: "dev-subnet"
      TF_VAR_subnet_cidr: "10.10.0.0/24"
      TF_VAR_bucket_name: "verdant-tempest-504711-j0-tfstate"
      TF_VAR_terraform_sa_name: "terraform-sa"
      TF_VAR_wif_pool_id: "github-actions-pool"
      TF_VAR_wif_provider_id: "github-oidc"
      TF_VAR_github_repository: "sharmake121/enterprise-gcp-platform-engineering-lab"

    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/335456104499/locations/global/workloadIdentityPools/github-actions-pool/providers/github-oidc
          service_account: terraform-sa@verdant-tempest-504711-j0.iam.gserviceaccount.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -lock=false